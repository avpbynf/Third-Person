name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            Unofficial port of [Leawind's Third Person](https://github.com/Leawind/Third-Person).
            Requires [Architectury API](https://www.curseforge.com/minecraft/mc-mods/architectury-api). Install [Cloth Config](https://www.curseforge.com/minecraft/mc-mods/cloth-config) or [YACL](https://modrinth.com/mod/yacl) for the in-game config screen.
